# AIGC-LifeChain 统一开发环境
#
# 包含全部基础设施 + Fabric 区块链网络，一个 compose 统一管理
#
# 启动: docker compose --env-file ../backend/.env up -d
# 停止: docker compose --env-file ../backend/.env down
# 清空全部数据重来: docker compose --env-file ../backend/.env down -v
#
# 端口规划（避免与其他项目冲突）:
#   MySQL    -> 3307
#   Redis    -> 6380
#   MinIO    -> 9020 (API) / 9021 (Console)
#   RabbitMQ -> 5672 (AMQP) / 15672 (Management UI)
#   Milvus   -> 19530 (gRPC) / 9091 (health)
#   Feature  -> 8090 (Python 特征提取服务)
#   Orderer  -> 27050           (容器内 7050；避开 fabric-samples test-network 默认 7050)
#   Peer Org1 -> 27051 / 27052  (容器内 7051 / 7052；避开官方 7051 / 7052)
#   Peer Org2 -> 29051 / 29052  (容器内 9051 / 9052；避开官方 9051 / 9052)
#   Peer Ops  -> 17051 / 19051  (官方 test-network 不暴露 operations 端口，无冲突)
#   CA Org1  -> 27054           (容器内 7054；避开官方 7054)
#   CA Org2  -> 29054           (容器内 9054；官方默认 ca.org2 在 8054，错位即可)
#   OTel Collector -> 4319 (OTLP gRPC) / 4320 (OTLP HTTP) / 13133 (health)
#   Jaeger   -> 16686 (UI)
#   Prometheus -> 9090
#
# 容器之间走 fabric 内部 DNS（peer0.org1.lifechain.com:7051 等），所以
# 容器内监听端口必须保持 7050 / 7051 / 7052 / 9051 / 9052 / 7054 / 9054 不变，
# 只把宿主端口映射避开官方 test-network。这样 channel 配置、TLS SAN、链码
# build 出的容器都不需要重做。
#
# 所有环境变量统一从 backend/.env 读取
# 启动时必须加 --env-file ../backend/.env
#
# 项目镜像统一使用 aigc-lifechain/ 前缀，便于和本机其他项目镜像区分。
# 首次启动前可用本文件中的上游基础镜像重新 tag 到对应项目镜像名。

networks:
  lifechain-net:
    driver: bridge

volumes:
  lifechain-mysql-data:
  lifechain-redis-data:
  lifechain-minio-data:
  lifechain-rabbitmq-data:
  lifechain-milvus-data:
  lifechain-etcd-data:
  lifechain-orderer-data:
  lifechain-peer0-org1-data:
  lifechain-peer0-org2-data:
  lifechain-prometheus-data:

services:
  # ======================== 基础设施 ========================

  lifechain-mysql:
    container_name: lifechain-mysql
    image: aigc-lifechain/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-lifechain}
    ports:
      - "3307:3306"
    volumes:
      - lifechain-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - lifechain-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  lifechain-redis:
    container_name: lifechain-redis
    image: aigc-lifechain/redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - lifechain-redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - lifechain-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  lifechain-minio:
    container_name: lifechain-minio
    image: aigc-lifechain/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9020:9000"
      - "9021:9001"
    volumes:
      - lifechain-minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - lifechain-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  lifechain-rabbitmq:
    container_name: lifechain-rabbitmq
    image: aigc-lifechain/rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-lifechain}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-lifechain123}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    volumes:
      - lifechain-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - lifechain-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  lifechain-etcd:
    container_name: lifechain-etcd
    image: aigc-lifechain/etcd:v3.5.14
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd --advertise-client-urls=http://127.0.0.1:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - lifechain-etcd-data:/etcd
    networks:
      - lifechain-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  lifechain-milvus:
    container_name: lifechain-milvus
    image: aigc-lifechain/milvus:v2.4.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: lifechain-etcd:2379
      MINIO_ADDRESS: lifechain-minio:9000
      MINIO_ACCESSKEYID: ${MINIO_ACCESS_KEY}
      MINIO_SECRETACCESSKEY: ${MINIO_SECRET_KEY}
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "9091:9091"
    volumes:
      - lifechain-milvus-data:/var/lib/milvus
    networks:
      - lifechain-net
    depends_on:
      lifechain-etcd:
        condition: service_healthy
      lifechain-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  lifechain-feature-extract:
    container_name: lifechain-feature-extract
    image: aigc-lifechain/feature-extract:latest
    build:
      context: ../services/feature-extract
      dockerfile: Dockerfile
    ports:
      - "${FEATURE_SERVICE_PORT:-8090}:8090"
    environment:
      MINIO_ENDPOINT: http://lifechain-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-lifechain}
    networks:
      - lifechain-net
    depends_on:
      lifechain-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ======================== Fabric 区块链网络 ========================

  orderer.lifechain.com:
    container_name: orderer.lifechain.com
    image: aigc-lifechain/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/orderer
    command: orderer
    volumes:
      - ./fabric/channel-artifacts/genesis.block:/var/hyperledger/orderer/genesis.block
      - ./fabric/crypto-config/ordererOrganizations/lifechain.com/orderers/orderer.lifechain.com/msp:/var/hyperledger/orderer/msp
      - ./fabric/crypto-config/ordererOrganizations/lifechain.com/orderers/orderer.lifechain.com/tls:/var/hyperledger/orderer/tls
      - lifechain-orderer-data:/var/hyperledger/production/orderer
    ports:
      - "27050:7050"
    networks:
      - lifechain-net
    restart: unless-stopped

  peer0.org1.lifechain.com:
    container_name: peer0.org1.lifechain.com
    image: aigc-lifechain/fabric-peer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.org1.lifechain.com
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=infra_lifechain-net
      - CORE_PEER_ADDRESS=peer0.org1.lifechain.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.lifechain.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.lifechain.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.lifechain.com:7051
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:17051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_TLS_CLIENTAUTHREQUIRED=true
      - CORE_PEER_TLS_CLIENTROOTCAS_FILES=/etc/hyperledger/fabric/tls/ca.crt
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - ./fabric/crypto-config/peerOrganizations/org1.lifechain.com/peers/peer0.org1.lifechain.com/msp:/etc/hyperledger/fabric/msp
      - ./fabric/crypto-config/peerOrganizations/org1.lifechain.com/peers/peer0.org1.lifechain.com/tls:/etc/hyperledger/fabric/tls
      - /var/run/docker.sock:/var/run/docker.sock
      - lifechain-peer0-org1-data:/var/hyperledger/production
    ports:
      - "27051:7051"
      - "17051:17051"
      - "27052:7052"
    networks:
      - lifechain-net
    depends_on:
      - orderer.lifechain.com
    restart: unless-stopped

  peer0.org2.lifechain.com:
    container_name: peer0.org2.lifechain.com
    image: aigc-lifechain/fabric-peer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.org2.lifechain.com
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=infra_lifechain-net
      - CORE_PEER_ADDRESS=peer0.org2.lifechain.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.lifechain.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.lifechain.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.lifechain.com:9051
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:19051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_TLS_CLIENTAUTHREQUIRED=true
      - CORE_PEER_TLS_CLIENTROOTCAS_FILES=/etc/hyperledger/fabric/tls/ca.crt
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - ./fabric/crypto-config/peerOrganizations/org2.lifechain.com/peers/peer0.org2.lifechain.com/msp:/etc/hyperledger/fabric/msp
      - ./fabric/crypto-config/peerOrganizations/org2.lifechain.com/peers/peer0.org2.lifechain.com/tls:/etc/hyperledger/fabric/tls
      - /var/run/docker.sock:/var/run/docker.sock
      - lifechain-peer0-org2-data:/var/hyperledger/production
    ports:
      - "29051:9051"
      - "19051:19051"
      - "29052:9052"
    networks:
      - lifechain-net
    depends_on:
      - orderer.lifechain.com
    restart: unless-stopped

  ca.org1.lifechain.com:
    container_name: ca.org1.lifechain.com
    image: aigc-lifechain/fabric-ca:1.5.7
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_CA_CERTFILE=/etc/hyperledger/fabric-ca-server-config/ca.org1.lifechain.com-cert.pem
      - FABRIC_CA_SERVER_CA_KEYFILE=/etc/hyperledger/fabric-ca-server-config/priv_sk
      - FABRIC_CA_SERVER_TLS_ENABLED=false
    ports:
      - "27054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./fabric/crypto-config/peerOrganizations/org1.lifechain.com/ca/:/etc/hyperledger/fabric-ca-server-config
    networks:
      - lifechain-net
    restart: unless-stopped

  ca.org2.lifechain.com:
    container_name: ca.org2.lifechain.com
    image: aigc-lifechain/fabric-ca:1.5.7
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org2
      - FABRIC_CA_SERVER_CA_CERTFILE=/etc/hyperledger/fabric-ca-server-config/ca.org2.lifechain.com-cert.pem
      - FABRIC_CA_SERVER_CA_KEYFILE=/etc/hyperledger/fabric-ca-server-config/priv_sk
      - FABRIC_CA_SERVER_TLS_ENABLED=false
    ports:
      - "29054:9054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./fabric/crypto-config/peerOrganizations/org2.lifechain.com/ca/:/etc/hyperledger/fabric-ca-server-config
    networks:
      - lifechain-net
    restart: unless-stopped

  # ======================== 可观测性 ========================
  #
  # 数据流（生产标准 OpenTelemetry 链路）:
  #   App (OTLP HTTP/protobuf, localhost:4320) -> OTel Collector
  #     -> trace: Collector (OTLP gRPC) -> Jaeger
  #     -> metrics: Prometheus 直接抓取 App /actuator/prometheus
  #
  # Jaeger 的 OTLP 端口不再对宿主暴露：所有 trace 必须经过 Collector，
  # 这样后续可在 Collector 处统一做采样、属性增强、多后端 fanout。

  lifechain-otel-collector:
    container_name: lifechain-otel-collector
    image: aigc-lifechain/otel-collector-contrib:0.103.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4319:4317"   # OTLP gRPC（宿主 4319 -> 容器 4317，避开 Jaeger 占用过的 4317）
      - "4320:4318"   # OTLP HTTP/protobuf（宿主 4320 -> 容器 4318）
      - "13133:13133" # health_check
    networks:
      - lifechain-net
    depends_on:
      - lifechain-jaeger
    restart: unless-stopped

  lifechain-jaeger:
    container_name: lifechain-jaeger
    image: aigc-lifechain/jaeger-all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
    networks:
      - lifechain-net
    restart: unless-stopped

  lifechain-prometheus:
    container_name: lifechain-prometheus
    image: aigc-lifechain/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - lifechain-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - lifechain-net
    restart: unless-stopped
